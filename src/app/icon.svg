<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151B" />
      <stop offset="50%" stop-color="#0B0C10" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="80%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background tile with premium rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Outer ambient glow -->
  <circle cx="256" cy="256" r="140" fill="url(#primaryGrad)" opacity="0.12" filter="url(#glow)" />

  <!-- Iconic Bump "B" with dynamic crown upward crest -->
  <g transform="translate(136, 116)">
    <!-- Main Upward Vertical Pillar -->
    <rect x="0" y="24" width="44" height="232" rx="22" fill="url(#primaryGrad)" />
    
    <!-- Top Loop with energetic slant -->
    <path d="M 30 24 H 130 C 180 24 210 52 210 92 C 210 132 175 152 125 152 H 30 Z" fill="url(#primaryGrad)" />
    <!-- Top inner cutout -->
    <path d="M 44 56 H 122 C 150 56 168 70 168 90 C 168 112 148 122 120 122 H 44 Z" fill="#0C0D12" />

    <!-- Bottom Loop with wider dominance -->
    <path d="M 30 134 H 145 C 200 134 235 164 235 210 C 235 256 195 280 135 280 H 30 Z" fill="url(#primaryGrad)" />
    <!-- Bottom inner cutout -->
    <path d="M 44 164 H 132 C 165 164 190 180 190 208 C 190 236 162 250 128 250 H 44 Z" fill="#0C0D12" />

    <!-- Spark / Arrow peak at King slot position -->
    <path d="M 22 -6 L 36 16 L 8 16 Z" fill="#FBBF24" filter="url(#glow)" />
    <polygon points="12,14 22,-4 32,14" fill="#FFF" opacity="0.9" />
  </g>
</svg>
